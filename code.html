    .glass-card-sub {

      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);

      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gender-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    /* Dynamic Pulse for changes */
    @keyframes numberPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .pulse-anim {
      animation: numberPulse 0.25s ease-out;
    }

<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="minus" aria-hidden="true" class="lucide lucide-minus w-4 h-4"><path d="M5 12h14"></path></svg>

<!-- Quick Action Bar: Quick Add (+5) -->

        </span>

<button class="px-2 py-1 bg-cyan-500/10 hover:bg-cyan-500/25 text-cyan-300 rounded-md border border-cyan-500/20 font-mono transition-colors" onclick="quickAdd('men', 5)">+5 Hombres</button>
<button class="px-2 py-1 bg-rose-500/10 hover:bg-rose-500/25 text-rose-300 rounded-md border border-rose-500/20 font-mono transition-colors" onclick="quickAdd('women', 5)">+5 Mujeres</button>
</div>

</main>
<!-- Interactive JavaScript Logic -->
<script>
    // State management
    const state = {
      men: 0,
      women: 0
    };

    // DOM Elements cache
    const totalNumberEl = document.getElementById('total-number');
    const totalLabelEl = document.getElementById('total-label');
    const countMenEl = document.getElementById('count-men');
    const countWomenEl = document.getElementById('count-women');
    const btnDecMen = document.getElementById('btn-dec-men');
    const btnDecWomen = document.getElementById('btn-dec-women');
    const barMen = document.getElementById('bar-men');
    const barWomen = document.getElementById('bar-women');
    const percentMen = document.getElementById('percent-men');
    const percentWomen = document.getElementById('percent-women');

    function animateNumber(element) {
      element.classList.remove('pulse-anim');
      void element.offsetWidth; // trigger reflow
      element.classList.add('pulse-anim');
    }

    function updateUI() {
      const total = state.men + state.women;

      // 1. Update Sub-counters
      countMenEl.textContent = state.men;
      countWomenEl.textContent = state.women;

      // 2. Update Total Counter
      totalNumberEl.textContent = total;

      // 3. Singular vs Plural Requirement:
      // "Si el total es igual a 1, mostrar '1 Persona'. Si es distinto de 1 (0, 2, 3...), '[X] Personas'."
      if (total === 1) {
        totalLabelEl.textContent = '1 Persona';
      } else {
        totalLabelEl.textContent = `${total} Personas`;
      }

      // 4. Button Disability Rule:
      // "-1 queda deshabilitado cuando el valor actual de ese género sea 0"
      btnDecMen.disabled = (state.men <= 0);
      btnDecWomen.disabled = (state.women <= 0);

      // 5. Update Proportion Bar
      if (total === 0) {
        barMen.style.width = '50%';
        barWomen.style.width = '50%';
        percentMen.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span> 50% Hombres';
        percentWomen.innerHTML = '50% Mujeres <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>';
      } else {
        const pMen = Math.round((state.men / total) * 100);
        const pWomen = 100 - pMen;
        barMen.style.width = `${pMen}%`;
        barWomen.style.width = `${pWomen}%`;
        percentMen.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span> ${pMen}% Hombres (${state.men})`;
        percentWomen.innerHTML = `${pWomen}% Mujeres (${state.women}) <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>`;
      }
    }

    // Action: Increment
    function increment(gender) {
      if (gender === 'men') {
        state.men += 1;
        animateNumber(countMenEl);
      } else if (gender === 'women') {
        state.women += 1;
        animateNumber(countWomenEl);
      }
      animateNumber(totalNumberEl);
      updateUI();
    }

    // Action: Decrement with strictly lower limit >= 0
    function decrement(gender) {
      if (gender === 'men' && state.men > 0) {
        state.men -= 1;
        animateNumber(countMenEl);
      } else if (gender === 'women' && state.women > 0) {
        state.women -= 1;
        animateNumber(countWomenEl);
      }
      animateNumber(totalNumberEl);
      updateUI();
    }

    // Action: Quick Add
    function quickAdd(gender, count) {
      if (gender === 'men') {
        state.men += count;
        animateNumber(countMenEl);
      } else {
        state.women += count;
        animateNumber(countWomenEl);
      }
      animateNumber(totalNumberEl);
      updateUI();
    }

    // Action: Reset All
    function resetAll() {
      state.men = 0;
      state.women = 0;
      animateNumber(totalNumberEl);
      animateNumber(countMenEl);
      animateNumber(countWomenEl);
      updateUI();
    }

    // Initialize Lucide icons and UI state on load
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateUI();
    });
  </script>
